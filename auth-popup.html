<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signing in...</title>
    <style>
      :root {
        color-scheme: light;
        --bg: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
        --card-bg: rgba(255, 255, 255, 0.82);
        --card-border: rgba(148, 163, 184, 0.24);
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --accent: #4f46e5;
        --shadow: 0 20px 56px rgba(15, 23, 42, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        padding: 16px;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: var(--bg);
        color: var(--text-primary);
      }

      main {
        width: min(100%, 360px);
      }

      .card {
        border: 1px solid var(--card-border);
        border-radius: 18px;
        background: var(--card-bg);
        backdrop-filter: blur(12px);
        box-shadow: var(--shadow);
        padding: 28px 24px;
        text-align: center;
      }

      .spinner {
        width: 52px;
        height: 52px;
        margin: 0 auto 18px;
        border-radius: 50%;
        border: 5px solid rgba(79, 70, 229, 0.18);
        border-top-color: var(--accent);
        animation: spin 0.9s linear infinite;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.1rem;
        line-height: 1.3;
      }

      p {
        margin: 0;
        color: var(--text-secondary);
        font-size: 0.95rem;
        line-height: 1.5;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main aria-live="polite">
      <section class="card">
        <div class="spinner" aria-hidden="true"></div>
        <h1>Signing you in</h1>
        <p>Completing sign-in... please wait.</p>
      </section>
    </main>
    <script type="module" src="/src/auth/popupBridge.ts"></script>
  </body>
</html>
